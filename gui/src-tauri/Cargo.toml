[package]
name = "argon-gui"
version = "0.1.0"
description = "Argon desktop GUI"
authors = ["Argon contributors"]
edition = "2021"

[lib]
name = "argon_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "argon-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
